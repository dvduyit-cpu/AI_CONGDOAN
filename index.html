 <section class="panel"><h2>04 · Câu lệnh chưa rõ và câu lệnh đúng</h2><div class="compare-prompt"><div><span class="focus-tag">CHƯA RÕ</span><h3>“Viết kế hoạch công đoàn.”</h3><p>Thiếu đối tượng, quy mô, mục tiêu, thời gian, nơi thực hiện, định dạng và giới hạn.</p></div><div><span class="focus-tag">NÊN SỬ DỤNG</span><h3>Yêu cầu có đủ bối cảnh</h3><p>“Bạn là chuyên viên tham mưu LĐLĐ tỉnh. Hãy dự thảo kế hoạch tập huấn AI cho 100 cán bộ CĐCS trong 1 ngày; gồm mục đích, yêu cầu, nội dung, phân công và dự toán hạng mục. Thời gian và kinh phí chưa chốt, ghi [CẦN BỔ SUNG].”</p></div></div><div class="actions"><button class="btn primary" onclick="copy('Bạn là chuyên viên tham mưu Liên đoàn Lao động tỉnh. Hãy dự thảo kế hoạch tập huấn AI cho 100 cán bộ công đoàn cơ sở trong 1 ngày; gồm mục đích, yêu cầu, nội dung, phân công và dự toán hạng mục. Thời gian và kinh phí chưa chốt, ghi [CẦN BỔ SUNG]. Không tự tạo căn cứ pháp luật.')">Sao chép câu lệnh đúng</button></div></section>
 <section class="panel"><h2>05 · Thư viện 12 câu lệnh mẫu dành cho buổi đầu</h2><p class="hint">Chọn câu lệnh sát công việc bạn phụ trách. Nhấn <b>Sao chép</b> rồi dán vào ChatGPT hoặc Gemini. Thay dữ liệu giả lập bằng thông tin được phép sử dụng.</p><div class="prompt-library">${cards}</div></section>
 <section class="panel"><h2>06 · Bài thực hành – Tự làm trên máy</h2><ol class="steps"><li>Mở ChatGPT, thử mẫu “Phân tích nhiệm vụ”; lưu kết quả thành danh sách công việc.</li><li>Hỏi tiếp: “Chuyển thành bảng gồm công việc, người phụ trách, hạn hoàn thành, sản phẩm.”</li><li>Sử dụng mẫu “Soạn công văn”, kiểm tra ít nhất 3 chỗ AI đánh dấu cần bổ sung.</li><li>Chuyển sang Gemini và thử cùng câu lệnh; nêu 2 điểm khác biệt về cách trình bày.</li><li>Tự tạo một prompt mới theo 6 thành phần để làm công việc thật của mình nhưng dùng thông tin công khai hoặc giả lập.</li></ol><div class="spotlight"><strong>Sản phẩm cần có:</strong> 1 bảng phân công + 1 dự thảo công văn + 1 Prompt tự viết và 3 nhận xét kiểm chứng.</div><div class="actions"><button class="btn primary" onclick="go(0)">Tiếp tục chủ đề AI và công tác công đoàn →</button><button class="btn" onclick="go('files')">Mở kho file mẫu</button></div></section>`;
}

function accountPage(){return `<div class="hero"><div class="eyebrow">DÀNH CHO NGƯỜI MỚI BẮT ĐẦU</div><h1>Đăng ký tài khoản và cá nhân hóa AI</h1><p>Bắt đầu từ tạo tài khoản, đăng nhập, thiết lập phong cách trả lời và tự kiểm tra bằng một nhiệm vụ công đoàn.</p></div><section class="panel"><h2>A. Đăng ký tài khoản ChatGPT</h2><ol class="steps"><li>Mở trình duyệt Chrome hoặc Edge, truy cập <a href="https://chatgpt.com" target="_blank" rel="noopener">https://chatgpt.com</a>.</li><li>Nhấn <b>Sign up / Đăng ký</b> hoặc <b>Log in / Đăng nhập</b> tùy giao diện hiển thị.</li><li>Nếu có nút <b>Continue with Google</b>, chọn tài khoản Google muốn sử dụng; nếu chọn đăng ký bằng email, nhập email của bạn và làm theo các bước xác nhận được hiển thị.</li><li>Hoàn thành xác minh email hoặc bước xác minh danh tính mà hệ thống yêu cầu (nếu có). Không chia sẻ mã OTP, mật khẩu cho người khác.</li><li>Đăng nhập, mở một cuộc hội thoại mới, gõ câu “Hãy giải thích AI bằng 3 ví dụ trong công tác công đoàn”.</li><li>Kiểm tra đã nhận được câu trả lời. Việc tạo tài khoản cơ bản không đồng nghĩa phải mua gói trả phí.</li></ol><p class="warn">Nếu nút đăng ký hoặc hình thức xác minh khác với hướng dẫn, làm theo giao diện chính thức. Không dùng website giả mạo hoặc dịch vụ bán tài khoản.</p><a class="btn primary" href="https://chatgpt.com" target="_blank" rel="noopener">Mở trang chính thức ChatGPT ↗</a></section><section class="panel"><h2>B. Tạo tài khoản Google và đăng nhập Gemini</h2><ol class="steps"><li>Nếu đã có Gmail/Google, chuyển thẳng đến bước 4.</li><li>Nếu chưa có, mở <a href="https://accounts.google.com/signup" target="_blank" rel="noopener">https://accounts.google.com/signup</a>, chọn tạo tài khoản cá nhân hoặc loại tài khoản phù hợp.</li><li>Điền tên, thông tin đăng nhập và mật khẩu; xác minh theo yêu cầu của Google. Sử dụng số điện thoại khôi phục nếu được yêu cầu.</li><li>Truy cập <a href="https://gemini.google.com" target="_blank" rel="noopener">https://gemini.google.com</a>, chọn Sign in / Đăng nhập và dùng tài khoản Google vừa tạo.</li><li>Xác nhận điều khoản nếu có; tài khoản cơ quan có thể bị giới hạn quyền sử dụng bởi quản trị viên Google Workspace.</li><li>Gõ thử: “Hãy lập danh mục 5 việc cán bộ công đoàn có thể dùng AI hỗ trợ”.</li></ol><div class="actions"><a href="https://accounts.google.com/signup" target="_blank" rel="noopener" class="btn">Tạo tài khoản Google ↗</a><a href="https://gemini.google.com" target="_blank" rel="noopener" class="btn primary">Mở Gemini ↗</a></div></section><section class="panel"><h2>C. Cấu hình trợ lý ChatGPT cho công tác công đoàn</h2><ol class="steps"><li>Vào ChatGPT, mở biểu tượng tài khoản hoặc ảnh đại diện.</li><li>Chọn <b>Settings / Cài đặt</b> → <b>Personalization / Cá nhân hóa</b>.</li><li>Mở mục <b>Custom Instructions / Hướng dẫn tùy chỉnh</b>; bật tùy chỉnh nếu có công tắc.</li><li>Sao chép bản cấu hình bên dưới rồi dán vào ô hướng dẫn; nhấn lưu.</li><li>Mở cuộc hội thoại và thử: “Soạn thông báo họp nhưng chưa có ngày, người ký, địa điểm.” AI cần ghi rõ phần chờ bổ sung thay vì tự tạo.</li></ol><h3>D. Cấu hình Gemini</h3><p>Mở Settings &amp; help → phần cá nhân hóa hoặc Instructions for Gemini nếu tài khoản có hỗ trợ. Nếu không tìm thấy, bạn có thể dán mẫu hướng dẫn vào đầu cuộc trò chuyện mới. Tên menu có thể thay đổi theo tài khoản và phiên bản.</p><h3>Mẫu cấu hình có thể chỉnh sửa</h3><textarea id="settingtxt">${esc(personalization)}</textarea><div class="actions"><button class="btn primary" onclick="copy($('settingtxt').value)">⧉ Sao chép cá nhân hóa</button><button class="btn" onclick="localStorage.setItem('doan_custom_v2',$('settingtxt').value);toast('Đã lưu mẫu cấu hình')">Lưu trên máy</button></div><p class="warn">Bảo mật: không nhập họ tên/CCCD/số tài khoản/hồ sơ nhạy cảm của đoàn viên hay tài liệu mật vào công cụ AI công khai. Cài đặt quyền riêng tư không thay thế quy định bảo mật của cơ quan.</p></section><section class="panel"><h2>E. Kiểm tra sau khi tạo tài khoản</h2><ol><li>Đăng nhập được ChatGPT.</li><li>Đăng nhập được Gemini.</li><li>Biết bắt đầu cuộc trò chuyện mới.</li><li>Biết sao chép prompt và đánh giá đầu ra.</li><li>Đã lưu hoặc sử dụng mẫu cá nhân hóa.</li></ol><p class="hint">Tài liệu tham khảo chính thức: <a href="https://help.openai.com/en/articles/8096356-chatgpt-custom-instructions" target="_blank">OpenAI về Custom Instructions</a> · <a href="https://support.google.com/gemini/answer/13278668" target="_blank">Google về đăng nhập Gemini</a>.</p></section><div class="footer"><button class="btn" onclick="go('home')">← Giới thiệu</button><button class="btn primary" onclick="go(0)">Bắt đầu học →</button></div>`}

function homePage(){return `<div class="hero"><div class="eyebrow">CHƯƠNG TRÌNH 1,5 NGÀY · 15 CHỦ ĐỀ</div><h1>ỨNG DỤNG TRÍ TUỆ NHÂN TẠO (AI) TRONG CÔNG TÁC VĂN PHÒNG</h1><p>Học từ thao tác cơ bản đến tự làm hồ sơ công việc. Tài liệu viết trực tiếp cho học viên, có ví dụ nghiệp vụ, bài thực hành, sơ đồ quy trình và ảnh minh họa để dễ quan sát.</p><div class="stats"><span class="pill">15 × 45 phút</span><span class="pill">Bám sát công việc công đoàn</span><span class="pill">Có sơ đồ minh họa</span><span class="pill">Có file dữ liệu mẫu</span></div></div>
<section class="panel"><h2>Khi chưa có AI, bạn thường gặp khó khăn gì?</h2><p class="hint">Bắt đầu khóa học từ những vấn đề rất thực tế trong công việc văn phòng và công đoàn.</p><div class="problem-grid"><div class="problem-card"><div class="problem-icon">📄</div><h3>Soạn văn bản mất nhiều thời gian</h3><p>Phải tìm mẫu cũ, chỉnh sửa thủ công, sợ sót ý và tốn nhiều thời gian để hoàn thiện công văn, kế hoạch, báo cáo.</p></div><div class="problem-card"><div class="problem-icon">📊</div><h3>Tổng hợp số liệu dễ nhầm</h3><p>Dữ liệu từ nhiều công đoàn cơ sở gửi về không đồng nhất, khó tổng hợp nhanh và dễ sai khi viết nhận xét, đánh giá.</p></div><div class="problem-card"><div class="problem-icon">⏰</div><h3>Công việc gấp, thời gian ít</h3><p>Lãnh đạo giao việc sát giờ họp, cần bản dự thảo ngay nhưng chưa đủ thông tin hoặc chưa biết bắt đầu từ đâu.</p></div><div class="problem-card"><div class="problem-icon">📣</div><h3>Tuyên truyền chưa hấp dẫn</h3><p>Nội dung còn dài, thiên về hành chính, khó chuyển thành bài đăng ngắn gọn, dễ hiểu cho đoàn viên và người lao động.</p></div></div><div class="highlight"><b>Mục tiêu của khóa học:</b> dùng AI như một trợ lý hỗ trợ suy nghĩ, soạn nháp, tổng hợp, gợi ý và trình bày; còn bạn là người kiểm tra, quyết định và hoàn thiện sản phẩm cuối cùng.</div></section>
<section class="panel"><h2>Sơ đồ chuyển đổi cách làm việc: từ chưa có AI đến có AI hỗ trợ</h2><div class="compare-wrap"><div class="compare before"><div class="mini-badge">TRƯỚC KHI CÓ AI</div><h3>Quy trình cũ</h3><div class="diagram"><div class="stepbox"><div class="num">1</div><h4>Tìm mẫu cũ</h4><p>Mở nhiều tệp văn bản, lục lại email, hỏi đồng nghiệp để kiếm tài liệu tham khảo.</p></div><div class="arrowline">→</div><div class="stepbox"><div class="num">2</div><h4>Tự viết từ đầu</h4><p>Gõ tay từng phần, vừa viết vừa nghĩ, dễ thiếu ý hoặc trình bày chưa cân đối.</p></div><div class="arrowline">→</div><div class="stepbox"><div class="num">3</div><h4>Sửa nhiều lần</h4><p>Phải đọc lại, chỉnh câu chữ, bổ sung mục còn thiếu và kiểm tra lại toàn bộ.</p></div><div class="arrowline">→</div><div class="stepbox"><div class="num">4</div><h4>Nộp chậm</h4><p>Áp lực thời gian cao, đầu ra không đồng đều nếu thông tin đầu vào chưa đầy đủ.</p></div></div></div><div class="compare after"><div class="mini-badge">KHI CÓ AI HỖ TRỢ</div><h3>Quy trình mới</h3><div class="diagram"><div class="stepbox"><div class="num">1</div><h4>Giao việc rõ ràng</h4><p>Nêu vai trò, bối cảnh, nhiệm vụ, dữ liệu và yêu cầu đầu ra bằng câu lệnh cụ thể.</p></div><div class="arrowline">→</div><div class="stepbox"><div class="num">2</div><h4>AI tạo bản nháp</h4><p>AI gợi ý cấu trúc, viết dự thảo, tóm tắt, tổng hợp hoặc hướng dẫn từng bước.</p></div><div class="arrowline">→</div><div class="stepbox"><div class="num">3</div><h4>Bạn kiểm tra</h4><p>Đọc lại, đối chiếu số liệu, pháp lý, thể thức và chỉnh theo yêu cầu thực tế của đơn vị.</p></div><div class="arrowline">→</div><div class="stepbox"><div class="num">4</div><h4>Hoàn thiện nhanh hơn</h4><p>Có sản phẩm rõ ràng, dễ chỉnh sửa, tiết kiệm thời gian mà vẫn bảo đảm người dùng làm chủ kết quả.</p></div></div></div></div></section>
<section class="panel"><h2>Ảnh minh họa quy trình học tập và ứng dụng AI</h2><div class="illus-grid"><div class="illus-card"><svg class="illus-svg" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="170" rx="14" fill="url(#g1)"/><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#dfeefe"/></linearGradient></defs><rect x="28" y="36" width="88" height="108" rx="12" fill="#ffffff" stroke="#c7dff7"/><rect x="42" y="53" width="58" height="8" rx="4" fill="#7ab3eb"/><rect x="42" y="69" width="48" height="8" rx="4" fill="#cbddee"/><rect x="42" y="85" width="54" height="8" rx="4" fill="#cbddee"/><circle cx="182" cy="66" r="24" fill="#1161a8"/><rect x="166" y="92" width="32" height="40" rx="10" fill="#1161a8"/><circle cx="232" cy="46" r="12" fill="#0bb3a9"/><rect x="219" y="61" width="26" height="30" rx="7" fill="#0bb3a9"/><path d="M126 89h24" stroke="#1161a8" stroke-width="4" stroke-linecap="round"/><path d="M145 89l-8-7m8 7l-8 7" stroke="#1161a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>Từ tài liệu thô đến bản nháp nhanh</h3><p>AI giúp chuyển các ghi chú rời rạc thành công văn, kế hoạch, báo cáo hoặc bảng tổng hợp ban đầu.</p></div><div class="illus-card"><svg class="illus-svg" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="170" rx="14" fill="url(#g2)"/><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#d7ebff"/></linearGradient></defs><rect x="36" y="28" width="248" height="114" rx="14" fill="#fff" stroke="#c7dff7"/><rect x="56" y="48" width="130" height="18" rx="9" fill="#e7f2ff"/><rect x="56" y="80" width="190" height="10" rx="5" fill="#a5c9ee"/><rect x="56" y="98" width="160" height="10" rx="5" fill="#d2e3f5"/><circle cx="244" cy="57" r="22" fill="#1161a8"/><path d="M236 57h16M244 49v16" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><h3>Học theo bước, nhìn là làm được</h3><p>Nội dung được chia thành các khối rõ ràng: kiến thức, sơ đồ, ví dụ, câu lệnh mẫu và bài thực hành.</p></div><div class="illus-card"><svg class="illus-svg" viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="170" rx="14" fill="url(#g3)"/><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#effaf9"/><stop offset="1" stop-color="#d8f2ef"/></linearGradient></defs><rect x="30" y="42" width="60" height="88" rx="10" fill="#fff" stroke="#badfd9"/><rect x="102" y="54" width="70" height="18" rx="9" fill="#11a39a" opacity=".9"/><rect x="102" y="82" width="114" height="12" rx="6" fill="#98d7d1"/><rect x="102" y="102" width="140" height="12" rx="6" fill="#c6ebe7"/><rect x="226" y="50" width="66" height="66" rx="14" fill="#1161a8"/><path d="M244 82l12 12 18-24" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>Kiểm tra rồi mới sử dụng</h3><p>Học viên luôn được nhắc phải kiểm chứng số liệu, căn cứ, tên cơ quan, thời gian và mức độ bảo mật trước khi dùng sản phẩm AI.</p></div></div></section>
<section class="panel"><h2>Khó khăn khi chưa ứng dụng AI</h2><div class="challenge-grid"><div class="challenge-card"><div class="icon-bubble">⏳</div><strong>Soạn thảo nhiều giờ</strong><p>Tìm văn bản cũ, tự viết lại kế hoạch, báo cáo và chỉnh sửa qua nhiều vòng.</p></div><div class="challenge-card"><div class="icon-bubble">📊</div><strong>Số liệu phân tán</strong><p>Báo cáo từ công đoàn cơ sở có nhiều định dạng, khó tổng hợp và dễ sai lệch.</p></div><div class="challenge-card"><div class="icon-bubble">📣</div><strong>Truyền thông khó trực quan</strong><p>Chuyển thông báo dài thành poster, bài đăng, âm thanh thường tốn thời gian.</p></div><div class="challenge-card"><div class="icon-bubble">🔄</div><strong>Phối hợp thủ công</strong><p>Lấy ý kiến, gửi file, chỉnh sửa chung chưa thuận tiện khi làm việc theo nhóm.</p></div></div><div class="callout-blue">AI giúp tạo bản nháp và hỗ trợ xử lý công việc, nhưng cán bộ vẫn chịu trách nhiệm kiểm tra số liệu, pháp lý, tính chính xác và bảo mật.</div></section><section class="panel"><h2>Sơ đồ ứng dụng AI vào một nhiệm vụ văn phòng</h2><div class="workflow"><span data-n="01">Xác định nhiệm vụ</span><span data-n="02">Chuẩn bị dữ liệu</span><span data-n="03">Viết Prompt</span><span data-n="04">AI tạo bản nháp</span><span data-n="05">Kiểm chứng và xuất file</span></div><p>Ví dụ: Nhận yêu cầu tổ chức hội nghị → chuẩn bị thông tin → yêu cầu ChatGPT viết kế hoạch → chỉnh Word/Docs → dùng Canva thiết kế banner → Forms khảo sát → Vbee tạo bản đọc.</p><button class="btn primary" onclick="go('tools')">Xem hướng dẫn các công cụ văn phòng →</button></section><section class="panel"><h2>Hệ sinh thái Google ứng dụng trong công tác văn phòng</h2><p>Tạo phiếu khảo sát và xử lý phản hồi là tình huống xuyên suốt: Google Forms → Google Sheets → Google Docs → Drive → Gmail.</p><button class="btn primary" onclick="go('google')">Mở bài học Google và tạo Forms →</button></section><div class="columns"><section class="panel"><h2>Lộ trình học</h2><p><b>Ngày function officeToolPage(id){const t=officeTools.find(x=>x.id===id);if(!t)return toolsPage();return `<div class="tool-hero"><div class="eyebrow" style="color:#bde0ff">CÔNG CỤ HỖ TRỢ CÔNG TÁC VĂN PHÒNG</div><h1>${t.icon} ${esc(t.title)}</h1><p>${esc(t.goal)}</p><div class="action-row"><a class="btn" href="${t.url}" target="_blank" rel="noopener noreferrer">Mở công cụ chính thức ↗</a><button class="btn" onclick="go('tools')">← Tất cả công cụ</button></div></div><section class="tool-section"><h2>Hướng dẫn thao tác từng bước</h2><ol class="steps">${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="warn">Giao diện và các tính năng miễn phí/trả phí có thể thay đổi. Nếu tên nút khác nhau, đối chiếu hướng dẫn trên trang chính thức của công cụ.</p></section><section class="tool-section"><h2>5 ví dụ áp dụng trong công tác công đoàn</h2><div class="example-list">${t.examples.map((ex,i)=>`<div class="example-item"><b>Ví dụ ${i+1}</b><p>${esc(ex)}</p></div>`).join('')}</div></section><section class="tool-section"><h2>Câu lệnh AI mẫu – Sao chép để thực hiện</h2><div class="prompt">${esc(t.prompt)}</div><div class="action-row"><button class="btn primary" onclick="copy(officeTools.find(x=>x.id==='${t.id}').prompt)">⧉ Sao chép câu lệnh</button><a class="btn" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Mở ChatGPT ↗</a></div></section><section class="tool-section"><h2>5 bài thực hành có cách làm</h2><p class="hint">Bấm vào từng bài để mở phần hướng dẫn giải. Thực hiện với dữ liệu giả lập và lưu kết quả đúng yêu cầu.</p>${t.tasks.map((task,i)=>`<details class="practice-block"><summary>Bài ${i+1}. ${esc(task)} ▾</summary><ol><li>Đọc kỹ yêu cầu và lấy dữ liệu mẫu phù hợp ở phần tài liệu.</li><li>Mở công cụ chính thức bằng nút phía trên; xem mục hướng dẫn thao tác và thực hiện những bước liên quan đến bài này.</li><li>Nếu cần nội dung đầu vào, sao chép prompt mẫu ở trên, thay tên nhiệm vụ và yêu cầu đầu ra theo đề.</li><li>Thực hiện sản phẩm và kiểm tra nội dung, tên file, chính tả tiếng Việt, số liệu và quyền chia sẻ trước khi nộp.</li><li>Lưu sản phẩm hoặc ảnh chụp kết quả, đặt tên Cong_doan_${t.id}_Bai_${i+1}.</li></ol><p><b>Đáp án đạt yêu cầu:</b> có sản phẩm đúng loại tài liệu/tệp, nội dung phù hợp đề bài và không chứa dữ liệu bí mật hoặc thông tin cá nhân không cần thiết.</p></details>`).join('')}</section><section class="tool-section"><h2>Tệp thực hành mẫu</h2><p>${esc(t.sample)} – nằm trong thư mục <b>Hoc_lieu_bo_sung</b> của gói ZIP.</p><a class="btn primary" href="Hoc_lieu_bo_sung/${encodeURIComponent(t.sample)}" download>↓ Tải file mẫu</a><div class="callout-blue">Quy trình cốt lõi: Chuẩn bị nội dung → Viết câu lệnh → Dùng công cụ → Kiểm tra → Xuất và lưu sản phẩm.</div></section>`}

<section class="tool-section"><h2>Kiểm tra kết quả cuối chuyên đề</h2><div class="google-check"><label><input type="checkbox"> Đã tạo tài khoản Google hoặc đăng nhập tài khoản được phép</label><label><input type="checkbox"> Đã tạo Form đủ câu hỏi và định dạng trả lời phù hợp</label><label><input type="checkbox"> Đã xem trước và điền phiếu thử</label><label><input type="checkbox"> Đã kiểm tra quyền người trả lời trước khi xuất bản</label><label><input type="checkbox"> Đã liên kết kết quả với Google Sheets</label><label><input type="checkbox"> Đã lập biểu đồ và báo cáo tóm tắt</label></div></section>`;
}
const googleFormsPrompt='Bạn là chuyên viên đào tạo kỹ năng số cho cán bộ công đoàn các cấp. Hãy thiết kế Google Form “Khảo sát kết thúc tập huấn AI trong công tác văn phòng” gồm 10 câu. Mỗi câu cho tôi: tên câu hỏi, loại câu hỏi trong Google Forms, các lựa chọn, có bắt buộc không và mục đích sử dụng. Ưu tiên câu đánh giá nội dung, giảng dạy, mức tự tin áp dụng và góp ý. Không thu dữ liệu nhạy cảm. Sau đó chỉ dẫn từng bước tạo, thử, xuất bản, chia sẻ và liên kết câu trả lời sang Google Sheets.';
function googleModulePage(i){
const m=googleModules[i];if(!m)return googlePage();
return `<div class="tool-hero"><div class="eyebrow" style="color:#bde0ff">HỆ SINH THÁI GOOGLE · THỰC HÀNH</div><h1>${esc(m.icon)} ${esc(m.title)}</h1><p>${esc(m.goal)}</p><div class="action-row"><a class="btn" href="${m.url}" target="_blank" rel="noopener noreferrer">Mở Google chính thức ↗</a><button class="btn" onclick="go('google')">← Quay về hệ sinh thái Google</button></div></div>
<section class="tool-section"><h2>Hướng dẫn thao tác từng bước</h2><ol class="steps">${m.steps.map(a=>`<li>${esc(a)}</li>`).join('')}</ol><p class="warn">Lưu ý: tên nút có thể khác theo ngôn ngữ tài khoản. Với Forms, phiên bản hiện nay có bước xuất bản và quản lý quyền người trả lời; hãy kiểm tra trước khi gửi liên kết.</p></section>
<section class="tool-section"><h2>5 ví dụ thực tế cho cán bộ công đoàn</h2><div class="example-list">${m.examples.map((x,j)=>`<div class="example-item"><b>Ví dụ ${j+1}</b><p>${esc(x)}</p></div>`).join('')}</div></section>
<section class="tool-section"><h2>Câu lệnh ChatGPT hỗ trợ thao tác</h2><div class="prompt">${esc(m.prompt)}</div><button class="btn primary" onclick="copy(googleModules[${i}].prompt)">⧉ Sao chép Prompt</button></section>
${i===5?`<section class="tool-section"><h2>Bộ 10 bài thực hành Google Forms và cách giải</h2>${formsExercises.map((ex,j)=>`<details class="practice-block"><summary>Bài ${j+1}. ${esc(ex[0])} ▾</summary><ol class="steps">${ex[1].split(' → ').map(k=>`<li>${esc(k)}</li>`).join('')}</ol><p><b>Kết quả đạt yêu cầu:</b> ${esc(ex[2])}</p></details>`).join('')}<a class="btn primary" href="Hoc_lieu_bo_sung/Google_Forms_Mau_10_cau_hoi.csv" download>↓ Tải mẫu câu hỏi Google Forms</a><a class="btn" href="Hoc_lieu_bo_sung/Google_Forms_Phan_hoi_gia_lap.csv" download>↓ Tải dữ liệu phản hồi mẫu</a></section>`:''}
<section class="tool-section"><h2>Ứng dụng vào công việc</h2><p><b>Bài giao:</b> Hãy làm thử một sản phẩm mẫu từ công cụ này; lưu tệp hoặc chụp màn hình kết quả. Kiểm tra tính chính xác, quyền chia sẻ và định dạng trước khi gửi.</p></section>`;
}

function render(){nav();$('main').innerHTML=typeof page==='number'?lessonPage(page):page==='home'?homePage():page==='account'?accountPage():page==='start'?startPage():page==='tools'?toolsPage():page==='google'?googlePage():String(page).startsWith('gmodule:')?googleModulePage(Number(String(page).slice(8))):String(page).startsWith('tool:')?officeToolPage(String(page).slice(5)):filesPage();if(page==='account'&&localStorage.getItem('doan_custom_v2'))$('settingtxt').value=localStorage.getItem('doan_custom_v2')}
function saveNote(){localStorage.setItem('doan_note_'+page,$('note').value);toast('Đã lưu ghi chú trên trình duyệt này')}
function togglePresent(){document.body.classList.toggle('present');if(document.body.classList.contains('present')){document.documentElement.requestFullscreen?.().catch(()=>{})}else if(document.fullscreenElement){document.exitFullscreen?.().catch(()=>{})}}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight'&&typeof page==='number'&&page<14)go(page+1);if(e.key==='ArrowLeft'&&typeof page==='number'&&page>0)go(page-1);if(e.key==='Escape'&&document.body.classList.contains('present'))togglePresent()});render();
</script></body></html>
